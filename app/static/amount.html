<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Amount</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px calc(24px + env(safe-area-inset-bottom)); gap: 18px; }

  .title { font-size: 15px; color: var(--hint); text-align: center; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px;
    padding: 22px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: box-shadow 160ms ease-out; }
  .field:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  .field.invalid { box-shadow: 0 0 0 2px var(--danger); }

  .row { display: flex; align-items: baseline; justify-content: center; gap: 8px; width: 100%; }
  input {
    width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 44px; font-weight: 600; letter-spacing: -0.02em; text-align: center;
    font-variant-numeric: tabular-nums; caret-color: var(--accent); padding: 0;
  }
  input::placeholder { color: var(--hint); opacity: .5; }
  .cur { font-size: 18px; color: var(--hint); flex: none; }
  .preview { font-size: 14px; color: var(--hint); min-height: 20px; font-variant-numeric: tabular-nums; }

  .meta { font-size: 14px; color: var(--hint); text-align: center; }
  .error { font-size: 14px; color: var(--danger); min-height: 20px; text-align: center;
    opacity: 0; transform: translateY(-2px); transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
  .error.show { opacity: 1; transform: none; }

  /* Fallback button, only when opened outside Telegram */
  button { display: none; width: 100%; max-width: 420px; border: 0; border-radius: 14px; padding: 15px;
    font: 600 16px/1 inherit; background: var(--accent); color: var(--accent-text);
    transition: transform 160ms ease-out; }
  button:active { transform: scale(0.97); }
  .standalone button { display: block; }

  .shake { animation: shake 220ms var(--ease-out); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; }
    .error { transition: opacity 150ms ease; transform: none; }
  }
</style>
</head>
<body>
<main>
  <div class="title" id="title"></div>
  <div class="field" id="field">
    <div class="row">
      <input id="amount" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off"
             enterkeyhint="done" placeholder="0" aria-label="Amount">
      <span class="cur" id="cur"></span>
    </div>
    <div class="preview" id="preview"></div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="error" id="error" role="alert"></div>
  <button id="fallback" type="button"></button>
</main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") === "am" ? "am" : "en";
  const max = q.has("max") ? parseFloat(q.get("max")) : null;
  const allowZero = q.get("zero") === "1";
  const cur = q.get("cur") || "Birr";

  const T = {
    en: { save: "Save", available: "Available", bad: "Enter a valid amount", tooMuch: "Not enough money",
          sending: "Saving…", failed: "Could not save. Please try again.", open: "Open this from the bot in Telegram." },
    am: { save: "አስቀምጥ", available: "ያለው", bad: "ትክክለኛ መጠን ያስገቡ", tooMuch: "በቂ ገንዘብ የለም",
          sending: "በማስቀመጥ ላይ…", failed: "አልተሳካም። እንደገና ይሞክሩ።", open: "ይህን በቴሌግራም ውስጥ ከቦቱ ይክፈቱ።" },
  }[lang];

  const $ = (id) => document.getElementById(id);
  const input = $("amount"), field = $("field"), error = $("error");
  const fmt = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 2 });

  document.documentElement.lang = lang;
  $("title").textContent = q.get("title") || "";
  $("cur").textContent = cur;
  if (max !== null) $("meta").textContent = `${T.available}: ${fmt(max)} ${cur}`;

  const value = () => {
    const raw = input.value.replace(/\s/g, "").replace(",", ".");
    if (!/^\d+(\.\d{0,2})?$/.test(raw)) return null;
    const n = parseFloat(raw);
    return Number.isFinite(n) ? n : null;
  };

  const check = () => {
    const n = value();
    if (n === null || (n === 0 && !allowZero) || n > 1e10) return T.bad;
    if (max !== null && n > max + 1e-9) return T.tooMuch;
    return "";
  };

  const showError = (msg) => {
    error.textContent = msg;
    error.classList.toggle("show", !!msg);
    field.classList.toggle("invalid", !!msg);
  };

  const refresh = () => {
    // keep only digits and one separator, at most 2 decimals
    let v = input.value.replace(/[^\d.,]/g, "").replace(",", ".");
    const i = v.indexOf(".");
    if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2);
    v = v.replace(/^0+(?=\d)/, "");
    if (v !== input.value) input.value = v;
    const n = value();
    $("preview").textContent = n ? `${fmt(n)} ${cur}` : "";
    if (error.classList.contains("show")) showError(check());
    if (tg) n || (allowZero && n === 0) ? tg.MainButton.enable() : tg.MainButton.disable();
  };

  let busy = false;
  const submit = async () => {
    if (busy) return;
    const problem = check();
    if (problem) {
      showError(problem);
      field.classList.remove("shake"); void field.offsetWidth; field.classList.add("shake");
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    if (!tg || !tg.initData) { showError(T.open); return; }
    busy = true;
    tg.MainButton.showProgress(false);
    try {
      const r = await fetch("/app/amount", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ init_data: tg.initData, amount: value() }),
      });
      if (!r.ok) throw new Error(String(r.status));
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
      tg.close();
    } catch (e) {
      busy = false;
      tg.MainButton.hideProgress();
      showError(T.failed);
    }
  };

  input.addEventListener("input", refresh);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } });

  if (tg && tg.initData) {
    tg.ready();
    tg.expand();
    tg.MainButton.setParams({ text: T.save, is_visible: true, is_active: false });
    tg.MainButton.onClick(submit);
  } else {
    document.body.classList.add("standalone");
    $("fallback").textContent = T.save;
    $("fallback").addEventListener("click", submit);
  }

  // Open the number keyboard right away (Android does; iOS opens it on the first tap)
  setTimeout(() => input.focus(), 250);
  refresh();
})();
</script>
</body>
</html>
