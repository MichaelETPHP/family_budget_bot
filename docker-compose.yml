name: family-budget-bot

# Works with plain `docker compose up -d` (values come from .env)
# and with Coolify / Dokploy / Portainer (fill the variables in their UI).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      ALLOWED_PHONES: ${ALLOWED_PHONES:-}
      ACCOUNTS: ${ACCOUNTS:-}
      NAMES: ${NAMES:-}
      TIMEZONE: ${TIMEZONE:-Africa/Addis_Ababa}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      API_KEY: ${API_KEY:-}                # empty = /api/* disabled
      PUBLIC_URL: ${PUBLIC_URL:-}          # https address for the Mini App (defaults to WEBHOOK_URL)
      DATA_DIR: /app/data
      DB_PATH: /app/data/expenses.db
    volumes:
      - bot_data:/app/data          # database, live JSON, bot state, voice-note backups
    expose:
      - "8000"                      # health / API, internal only (no public port needed: the bot polls Telegram)
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  bot_data:
